<svg width="100%" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fathia Asanbe — Entry-Level Cybersecurity Analyst</title>
<desc>Animated typewriter banner introducing Fathia Asanbe and cycling through role titles: SOC Analyst, Log Analysis, Penetration Testing, Entry-Level Cybersecurity Analyst.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050912"/>
<stop offset="55%" stop-color="#0b1a33"/>
<stop offset="100%" stop-color="#173a63"/>
</linearGradient>
<clipPath id="clipName">
<rect id="clipNameRect" x="0" y="0" width="0" height="60">
<animate attributeName="width" dur="16s" repeatCount="indefinite"
values="0;0;480;480" keyTimes="0;0;0.125;1"/>
</rect>
</clipPath>
<clipPath id="clipRole1">
<rect id="clipRole1Rect" x="0" y="0" width="0" height="40">
<animate attributeName="width" dur="16s" repeatCount="indefinite"
values="0;0;158;158;0;0" keyTimes="0;0.1875;0.23125;0.34375;0.375;1"/>
</rect>
</clipPath>
<clipPath id="clipRole2">
<rect id="clipRole2Rect" x="0" y="0" width="0" height="40">
<animate attributeName="width" dur="16s" repeatCount="indefinite"
values="0;0;173;173;0;0" keyTimes="0;0.375;0.41875;0.53125;0.5625;1"/>
</rect>
</clipPath>
<clipPath id="clipRole3">
<rect id="clipRole3Rect" x="0" y="0" width="0" height="40">
<animate attributeName="width" dur="16s" repeatCount="indefinite"
values="0;0;288;288;0;0" keyTimes="0;0.5625;0.60625;0.71875;0.75;1"/>
</rect>
</clipPath>
<clipPath id="clipRole4">
<rect id="clipRole4Rect" x="0" y="0" width="0" height="40">
<animate attributeName="width" dur="16s" repeatCount="indefinite"
values="0;0;500;500;0;0" keyTimes="0;0.75;0.79375;0.90625;0.9375;1"/>
</rect>
</clipPath>
</defs>

<rect x="0" y="0" width="900" height="220" rx="14" fill="url(#bg)"/>

<g transform="translate(60,72)">
<text x="0" y="0" font-family="Courier New, monospace" font-size="34" font-weight="700" fill="#ffffff" clip-path="url(#clipName)">Hi, I'm Fathia Asanbe</text>
<rect x="482" y="-32" width="4" height="40" fill="#58a6ff">
<animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;0;1"/>
<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.125;0.1875;1" additive="sum"/>
</rect>
</g>

<g transform="translate(60,128)">
<text x="0" y="0" font-family="Courier New, monospace" font-size="14" fill="#7a8ba3">$ whoami --role</text>
</g>

<g transform="translate(60,168)">
<text x="0" y="0" font-family="Courier New, monospace" font-size="24" font-weight="600" fill="#58a6ff" clip-path="url(#clipRole1)">SOC Analyst</text>
<text x="0" y="0" font-family="Courier New, monospace" font-size="24" font-weight="600" fill="#5de1a5" clip-path="url(#clipRole2)">Log Analysis</text>
<text x="0" y="0" font-family="Courier New, monospace" font-size="24" font-weight="600" fill="#f0997b" clip-path="url(#clipRole3)">Penetration Testing</text>
<text x="0" y="0" font-family="Courier New, monospace" font-size="24" font-weight="600" fill="#ecc26a" clip-path="url(#clipRole4)">Entry-Level Cybersecurity Analyst</text>
</g>
</svg>
